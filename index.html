<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MALAM EKSOTIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(249, 115, 22, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(249, 115, 22, 0.1);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white">

    <!-- Top Header -->
    <header class="w-full py-6 px-4 text-center relative z-20">
        <div class="inline-block relative">
            <h1 class="text-6xl sm:text-7xl font-black uppercase tracking-widest text-transparent select-none opacity-20 absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none" style="-webkit-text-stroke: 2px #f97316; z-index: 1;">
                VIP
            </h1>
            <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-800 relative" style="z-index: 10; text-shadow: 0 4px 20px rgba(249,115,22,0.2);">
                MALAM EKSOTIS <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-amber-500"></span>
            </h2>
        </div>
        <p class="text-xs sm:text-sm text-slate-500 mt-2 font-medium">Pilih video favorit Anda</p>
    </header>

    <!-- Main Container with 3D Flip Card -->
    <main class="flex-grow flex items-center justify-center px-4 pb-12">
        <div id="cardContainer" class="w-full max-w-md perspective-1000 transition-transform duration-700">
            <div id="cardInner" class="relative w-full transform-style-3d duration-700 shadow-2xl rounded-3xl">

                <!-- FRONT SIDE: Dashboard Gallery -->
                <div class="backface-hidden glass rounded-3xl p-5 flex flex-col gap-4 shadow-xl">
                    
                    <!-- Search Box -->
                    <div class="relative flex items-center">
                        <input type="text" id="searchInput" placeholder="Cari video atau artis..." 
                            class="w-full bg-slate-100 border border-slate-200 rounded-2xl py-3 pl-4 pr-24 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-orange-500 transition-all">
                        <button id="searchBtn" class="absolute right-1.5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md transition-all">
                            Cari
                        </button>
                    </div>

                    <!-- Category Pills -->
                    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="categoryContainer">
                        <button class="cat-pill active-cat px-3.5 py-1.5 rounded-xl text-xs font-medium bg-orange-500 text-white shadow-md transition-all shrink-0" data-cat="Semua">Semua</button>
                        <button class="cat-pill px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-200 hover:bg-slate-300 text-slate-700 transition-all shrink-0" data-cat="Viral">Viral</button>
                        <button class="cat-pill px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-200 hover:bg-slate-300 text-slate-700 transition-all shrink-0" data-cat="Janda">Janda</button>
                        <button class="cat-pill px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-200 hover:bg-slate-300 text-slate-700 transition-all shrink-0" data-cat="ABG">ABG</button>
                        <button class="cat-pill px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-200 hover:bg-slate-300 text-slate-700 transition-all shrink-0" data-cat="Jilbab">Jilbab</button>
                    </div>

                    <!-- Video Grid 2x3 -->
                    <div id="videoGrid" class="grid grid-cols-2 gap-3.5"></div>

                    <!-- Pagination Controls -->
                    <div id="paginationContainer" class="flex items-center justify-between pt-2 border-t border-slate-200 text-xs"></div>
                </div>

                <!-- BACK SIDE: Video Player (Iframe Embed) -->
                <div class="absolute inset-0 backface-hidden rotate-y-180 glass rounded-3xl overflow-hidden flex flex-col bg-black shadow-2xl">
                    
                    <!-- Player Top Bar Controls -->
                    <div class="absolute top-4 left-4 right-4 z-30 flex items-center justify-between pointer-events-none">
                        <div class="bg-black/60 backdrop-blur-md px-3 py-1 rounded-full text-xs font-mono text-orange-400 border border-white/10 pointer-events-auto flex items-center gap-2">
                            <span id="playerTimer">Pemutar Video</span>
                        </div>
                        <button id="backToGalleryBtn" class="pointer-events-auto bg-black/70 hover:bg-black text-white px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 backdrop-blur-md shadow-lg transition-all flex items-center gap-1.5">
                            ← Galeri
                        </button>
                    </div>

                    <!-- Iframe Video Embed Element -->
                    <div class="relative w-full h-full flex-grow bg-black flex items-center justify-center">
                        <iframe id="mainVideoPlayer" class="w-full h-full border-0" allowfullscreen></iframe>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-slate-400 border-t border-slate-200">
        &copy; 2026 Gallery Videos XXX. All rights reserved.
    </footer>

    <!-- Popunder Script (Memicu 1x untuk 1 sesi pengunjung) -->
    <script src="https://pl30627583.profitableratecpmnetwork.com/d5/60/79/d56079c7788bd3e1f5be8a617ee76745.js"></script>

    <script>
        // Smartlink URLs
        const smartlinks = [
            "https://www.profitableratecpmnetwork.com/agijdjkf?key=b68403d796344c04660419b144a9cea4",
            "https://www.profitableratecpmnetwork.com/agijdjkf?key=b68403d796344c04660419b144a9cea4"
        ];
        let smartlinkIndex = 0;

        function triggerSmartlink() {
            let url = smartlinks[smartlinkIndex];
            smartlinkIndex = (smartlinkIndex + 1) % smartlinks.length;
            window.open(url, '_blank');
        }

        // Database Video dengan URL Gambar Baru yang Diberikan
        const videosData = [
            { id: 1, title: "Sentuhan Hangat di Malam Romantis", video: "https://playmogo.com/e/dfbxme4m8dhm", gambar: "https://i.ibb.co/xKQbLvRy/8f304f8b-ec98-4708-a9d7-23ca93409d8d.jpg", durasi: "5:21", cat: "Viral" },
            { id: 2, title: "Pesona Menggoda Penuh Gairah", video: "https://playmogo.com/e/6gwlxc8abam9", gambar: "https://i.ibb.co/1fL5NnP5/da614c18-72fc-424d-a84f-0408e238ac54.jpg", durasi: "8:18", cat: "Janda" },
            { id: 3, title: "Koleksi Eksklusif Menggoda Iman", video: "https://playmogo.com/e/d907jc4klz22", gambar: "https://i.ibb.co/xtZcTQm3/shinta.jpg", durasi: "7:58", cat: "Janda" },
            { id: 4, title: "Senyuman Manis Bikin Penasaran", video: "https://playmogo.com/e/ehnefdyiu0nq", gambar: "https://i.ibb.co/hF2DkYPY/H-ot-Video-Link-On-My-Bio.jpg", durasi: "8:06", cat: "ABG" },
            { id: 5, title: "Momen Spesial Tanpa Batas", video: "https://playmogo.com/e/l9s2yos0k9ix", gambar: "https://i.ibb.co/whw0n2SN/4ecaa51c-e68d-4551-828d-4c03ba2576ea.jpg", durasi: "4:47", cat: "Viral" },
            { id: 6, title: "Kejutan Manis Malam Ini", video: "https://playmogo.com/e/rfi9rk10ueqf", gambar: "https://i.ibb.co/Y4ZT0RFw/fef68142-59fc-4e09-941c-cc82ba7613d6.jpg", durasi: "1:23", cat: "Viral" },
            { id: 7, title: "Aksi Seru Penuh Kejutan Panas", video: "https://playmogo.com/e/yhqio0yfppk4", gambar: "https://i.ibb.co/JR84nZcM/0e45ed59-d6ba-4e60-8b8b-653fd385335c.jpg", durasi: "3:20", cat: "Janda" },
            { id: 8, title: "Gadis Manis Berbakat Spesial", video: "https://playmogo.com/e/fuxcm33f1876", gambar: "https://i.ibb.co/21VsfxMT/476f1dfc-0760-4f47-8f96-85d0eb2d76f0.jpg", durasi: "2:28", cat: "ABG" },
            { id: 9, title: "Pesona Anggun Mempesona", video: "https://playmogo.com/e/69g8imauk3ol", gambar: "https://i.ibb.co/5hgc71TN/1ee3cc03-0a43-4f40-9990-295c540f5b55.jpg", durasi: "5:52", cat: "Jilbab" },
            { id: 10, title: "Kecantikan Alami Bikin Terpikat", video: "https://playmogo.com/e/vdjazbdkjhye", gambar: "https://i.ibb.co/F4r1GJDr/10-M-Views-Tap-here-to-watch-the-full-clip.jpg", durasi: "9:33", cat: "Jilbab" },
            { id: 11, title: "Aura Hangat di Akhir Pekan", video: "https://playmogo.com/e/gl39h79i6plf", gambar: "https://i.ibb.co/xKQbLvRy/8f304f8b-ec98-4708-a9d7-23ca93409d8d.jpg", durasi: "6:15", cat: "Viral" },
            { id: 12, title: "Eksklusif Malam Penuh Warna", video: "https://playmogo.com/e/6l62537sowf9", gambar: "https://i.ibb.co/1fL5NnP5/da614c18-72fc-424d-a84f-0408e238ac54.jpg", durasi: "7:40", cat: "ABG" }
        ];

        let currentPage = 1;
        const itemsPerPage = 6;
        let currentCategory = "Semua";
        let searchQuery = "";

        const videoGrid = document.getElementById('videoGrid');
        const paginationContainer = document.getElementById('paginationContainer');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const cardContainer = document.getElementById('cardContainer');
        const cardInner = document.getElementById('cardInner');
        const mainVideoPlayer = document.getElementById('mainVideoPlayer');
        const backToGalleryBtn = document.getElementById('backToGalleryBtn');

        // Render Gallery Grid
        function renderGallery() {
            let filtered = videosData.filter(item => {
                let matchCat = currentCategory === "Semua" || item.cat === currentCategory;
                let matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            let totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            let start = (currentPage - 1) * itemsPerPage;
            let paginatedItems = filtered.slice(start, start + itemsPerPage);

            videoGrid.innerHTML = "";
            paginatedItems.forEach(item => {
                let card = document.createElement('div');
                card.className = "group relative aspect-[3/4] rounded-2xl overflow-hidden glass-card cursor-pointer shadow-lg hover:border-orange-500/50 transition-all duration-300";
                card.innerHTML = `
                    <img src="${item.gambar}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex flex-col justify-end p-2.5">
                        <span class="text-[10px] font-mono text-orange-400 font-semibold mb-0.5">${item.durasi}</span>
                        <h3 class="text-xs font-bold text-white line-clamp-2 leading-snug">${item.title}</h3>
                    </div>
                `;
                card.addEventListener('click', () => {
                    triggerSmartlink();
                    openPlayer(item);
                });
                videoGrid.appendChild(card);
            });

            paginationContainer.innerHTML = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="text-slate-400 cursor-not-allowed px-2 py-1"' : 'class="text-slate-700 hover:text-slate-900 px-2 py-1 font-semibold"'}>Prev</button>
                <span class="text-slate-600 font-medium">Hal ${currentPage} dari ${totalPages}</span>
                <button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled class="text-slate-400 cursor-not-allowed px-2 py-1"' : 'class="text-slate-700 hover:text-slate-900 px-2 py-1 font-semibold"'}>Next</button>
            `;
        }

        function changePage(page) {
            let filtered = videosData.filter(item => {
                let matchCat = currentCategory === "Semua" || item.cat === currentCategory;
                let matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });
            let totalPages = Math.ceil(filtered.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderGallery();
            }
        }

        // Category Filter
        document.querySelectorAll('.cat-pill').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.cat-pill').forEach(b => {
                    b.classList.remove('bg-orange-500', 'text-white', 'shadow-md');
                    b.classList.add('bg-slate-200', 'text-slate-700');
                });
                e.target.classList.remove('bg-slate-200', 'text-slate-700');
                e.target.classList.add('bg-orange-500', 'text-white', 'shadow-md');
                currentCategory = e.target.getAttribute('data-cat');
                currentPage = 1;
                renderGallery();
            });
        });

        // Search Handlers
        searchBtn.addEventListener('click', () => {
            searchQuery = searchInput.value.trim();
            currentPage = 1;
            renderGallery();
        });
        searchInput.addEventListener('keyup', (e) => {
            searchQuery = searchInput.value.trim();
            currentPage = 1;
            renderGallery();
        });

        // Open Player & Flip 180 deg
        function openPlayer(item) {
            cardInner.classList.add('rotate-y-180');
            mainVideoPlayer.src = item.video;
        }

        // Close Player & Flip Back
        backToGalleryBtn.addEventListener('click', () => {
            cardInner.classList.remove('rotate-y-180');
            mainVideoPlayer.src = "";
        });

        renderGallery();
    </script>
</body>
</html>
